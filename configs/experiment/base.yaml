name: base
seed: 0
device: cpu
output_dir: outputs

model:
  backbone:
    name: conch
    embed_dim: 512
    patch_sizes: [256, 512, 1024]
    proj_dim: 256
    patch_dropout: 0.1
  topology:
    d_topo: 128
    kmer_k: 3
    num_event_types: 5
    use_topology: true
  reca:
    num_heads: 4
    head_dim: 64
    use_reca: true
    standard_mha: false
  gad:
    num_genes: 50
    num_cnv_arms: 22
    hidden_dim: 256
    use_gad: true
  tftm:
    k_spatial: 8
    hidden_dim: 128
    use_tftm: true

data:
  cancer_types: [BRCA, UVM, LAML, LUAD, COAD]
  num_events: 200
  num_patches: 64
  grid_size: 8
  train_slides: 24
  val_slides: 6
  test_slides: 12
  randomize_input: false
  mean_predictor: false
  zero_patch: false
  zero_genetic: false
  zero_spatial: false
  latent_dim: 32
  noise: 0.35

train:
  epochs: 50
  batch_size: 16
  grad_accum: 4
  world_size: 4
  lr: 0.0005
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  warmup_steps: 500
  grad_clip: 1.0
  lambda_g: 0.5
  lambda_t: 0.1
  amp: true
  amp_dtype: bfloat16
  ema_decay: 0.999
