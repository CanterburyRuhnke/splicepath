[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splicepath"
version = "0.1.0"
description = "Splice-PSI, genetic architecture, and TME fate trajectory prediction from H&E whole slide images"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "computational-pathology",
    "alternative-splicing",
    "vision-language",
    "spatial-transcriptomics",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "simple-parsing>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.5",
    "black>=24.0",
    "isort>=5.12",
    "mypy>=1.10",
    "onnx>=1.16",
]

[project.scripts]
splicepath-fit = "splicepath.bottega.fit:main"
splicepath-assess = "splicepath.bottega.assess:main"
splicepath-read = "splicepath.bottega.read:main"
splicepath-cast = "splicepath.bottega.cast:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
splicepath = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = false
strict_equality = true
files = ["src/splicepath"]

[[tool.mypy.overrides]]
module = ["simple_parsing.*", "scipy.*", "onnx.*", "yaml.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
